<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuProfe20 Lab: Multiplicación de números decimales y aplicaciones</title>

    <!-- Tailwind CSS, React 18, ReactDOM y Babel -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- KaTeX para fórmulas matemáticas nítidas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap');

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100dvh;
            user-select: none;
            font-family: 'Nunito', sans-serif;
        }
        .font-fun { font-family: 'Nunito', sans-serif; }

        @keyframes floatUp {
            0% { transform: translateY(105vh) rotate(0deg); }
            100% { transform: translateY(-105vh) rotate(360deg); }
        }
        @keyframes slideInRight {
            0% { opacity: 0; transform: translateX(16px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes svgPop {
            0% { opacity: 0; transform: scale(0.65); }
            70% { opacity: 1; transform: scale(1.06); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes drawArc {
            from { stroke-dashoffset: 180; }
            to { stroke-dashoffset: 0; }
        }
        @keyframes commaPulse {
            0%, 100% { filter: drop-shadow(0 0 6px rgba(239, 68, 68, 0.85)); }
            50% { filter: drop-shadow(0 0 14px rgba(220, 38, 38, 1)); }
        }
        @keyframes robotFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        @keyframes robotThinkTilt {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(6deg) translateY(-3px); }
        }
        @keyframes robotJump {
            0%, 100% { transform: translateY(0); }
            30% { transform: translateY(-14px); }
        }
        @keyframes robotTalkArmL {
            0%, 100% { transform: rotate(45deg); }
            50% { transform: rotate(95deg); }
        }
        @keyframes robotTalkArmR {
            0%, 100% { transform: rotate(-45deg); }
            50% { transform: rotate(-95deg); }
        }
        @keyframes confettiExplosion {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(var(--rot)); opacity: 0; }
        }
        @keyframes finalGlow {
            0%, 100% { background-color: rgba(254, 240, 138, 0.35); }
            50% { background-color: rgba(253, 224, 71, 0.68); }
        }

        .scrollbar-hide::-webkit-scrollbar { display: none !important; }
        .scrollbar-hide { -ms-overflow-style: none !important; scrollbar-width: none !important; }

        .animate-floatUp { animation: floatUp linear infinite; }
        .animate-slideInRight { animation: slideInRight 0.35s ease-out forwards; }
        .animate-robotFloat { animation: robotFloat 3s ease-in-out infinite; }
        .animate-robotThinkTilt { animation: robotThinkTilt 2s ease-in-out infinite; }
        .animate-robotJump { animation: robotJump 1s cubic-bezier(0.28, 0.84, 0.42, 1) infinite; }
        .animate-robotTalkArmL { animation: robotTalkArmL 0.6s ease-in-out infinite; }
        .animate-robotTalkArmR { animation: robotTalkArmR 0.6s ease-in-out infinite 0.1s; }
        .animate-confettiExplosion { animation: confettiExplosion 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .animate-finalGlow { animation: finalGlow 2s ease-in-out infinite; }
        .animate-commaPulse { animation: commaPulse 1.3s ease-in-out infinite; }

        .svg-pop {
            transform-box: fill-box;
            transform-origin: center;
            animation: svgPop 0.42s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }
        .arc-draw {
            stroke-dasharray: 180;
            stroke-dashoffset: 180;
            animation: drawArc 0.45s ease-out forwards;
        }

        /* Estilos KaTeX ampliados para clases virtuales */
        .katex { font-weight: 800 !important; }
        .katex-display { margin: 0 !important; padding: 0 !important; }
        .math-card .katex { font-size: clamp(0.88rem, 1.25vw, 1.12rem) !important; color: #0f172a !important; }
        .math-enunciado .katex { font-size: clamp(1.08rem, 1.6vw, 1.45rem) !important; color: #fde047 !important; }
        .math-current .katex { font-size: clamp(1.45rem, 2.35vw, 2.25rem) !important; color: #0f172a !important; }
        .math-final .katex { font-size: clamp(1.55rem, 2.5vw, 2.4rem) !important; color: #065f46 !important; }
        .math-history .katex { font-size: clamp(1.2rem, 1.85vw, 1.78rem) !important; color: #475569 !important; }

        .math-flow-line {
            width: 100%;
            display: flex;
            align-items: center;
            overflow-x: auto;
            padding: 0.25rem 0;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, memo } = React;

        // =========================================================================
        // 1. ICONOS SVG INLINE
        // =========================================================================
        const Icon = ({ paths, className = "", size = 24, fill = "none", strokeWidth = "2.5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{ __html: paths }} />
        );

        const Rocket = (p) => <Icon {...p} paths='<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>' />;
        const Sparkles = (p) => <Icon {...p} paths='<path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M3 5h4"/><path d="M19 3v4"/><path d="M17 5h4"/>' />;
        const Home = (p) => <Icon {...p} paths='<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>' />;
        const ChevronLeft = (p) => <Icon {...p} paths='<polyline points="15 18 9 12 15 6"/>' />;
        const ChevronRight = (p) => <Icon {...p} paths='<polyline points="9 18 15 12 9 6"/>' />;
        const Shapes = (p) => <Icon {...p} paths='<path d="M8.3 10a.7.7 0 0 1-.626-1.079L11.4 3a.7.7 0 0 1 1.198-.043L16.3 8.9a.7.7 0 0 1-.572 1.1Z"/><rect x="3" y="14" width="7" height="7" rx="1"/><circle cx="17.5" cy="17.5" r="3.5"/>' />;

        // =========================================================================
        // 2. COMPONENTE KATEX
        // =========================================================================
        const MathDisplay = memo(({ latex, className = "", inline = false, align = "left" }) => {
            const containerRef = useRef(null);
            useEffect(() => {
                if (containerRef.current && window.katex) {
                    try {
                        window.katex.render(latex, containerRef.current, {
                            displayMode: !inline,
                            throwOnError: false,
                            strict: false,
                            trust: true
                        });
                    } catch (e) {
                        containerRef.current.innerText = latex;
                    }
                }
            }, [latex, inline]);

            if (inline) return <span ref={containerRef} className={`inline-block align-middle ${className}`} />;
            return (
                <div className={`math-flow-line scrollbar-hide ${align === 'center' ? 'justify-center' : 'justify-start'} ${className}`}>
                    <div ref={containerRef} className={align === 'center' ? 'text-center' : 'text-left'} />
                </div>
            );
        });

        // =========================================================================
        // 3. PIZARRA INTERACTIVA COMPLETA (SIN SONIDO)
        // =========================================================================
        const DrawingCanvas = () => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [isDrawMode, setIsDrawMode] = useState(false);
            const [tool, setTool] = useState('pen');
            const [isSnapMode, setIsSnapMode] = useState(false);
            const [penColor, setPenColor] = useState('#ef4444');
            const [penWidth, setPenWidth] = useState(6);
            const penPointsRef = useRef([]);
            const activePointerRef = useRef(null);
            const savedImageRef = useRef(null);
            const startPosRef = useRef({ x: 0, y: 0 });
            const historyRef = useRef([]);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas || !canvas.parentElement) return;
                const updateSize = (entries) => {
                    for (let entry of entries) {
                        const { width, height } = entry.contentRect;
                        const ctx = canvas.getContext('2d');
                        let imgData = null;
                        if (canvas.width > 0 && canvas.height > 0) {
                            try { imgData = ctx.getImageData(0, 0, canvas.width, canvas.height); } catch (e) {}
                        }
                        canvas.width = width;
                        canvas.height = height;
                        if (imgData) ctx.putImageData(imgData, 0, 0);
                    }
                };
                const observer = new ResizeObserver(updateSize);
                observer.observe(canvas.parentElement);
                return () => observer.disconnect();
            }, []);

            const renderPen = (points, straight = false) => {
                const ctx = canvasRef.current.getContext('2d');
                ctx.putImageData(savedImageRef.current, 0, 0);
                const angle = -15 * Math.PI / 180;
                const c = Math.cos(angle), s = Math.sin(angle);
                const local = points.map(p => ({ x: c * p.x + s * p.y, y: (-s * p.x + c * p.y) / 0.5 }));
                ctx.save();
                ctx.transform(c, s, -0.5 * s, 0.5 * c, 0, 0);
                ctx.lineWidth = penWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.strokeStyle = penColor;
                ctx.fillStyle = penColor;
                ctx.globalCompositeOperation = 'source-over';
                ctx.beginPath();
                ctx.moveTo(local[0].x, local[0].y);
                if (local.length === 1) {
                    ctx.arc(local[0].x, local[0].y, penWidth / 2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    if (!straight) {
                        for (let i = 1; i < local.length - 1; i++) {
                            const midpoint = { x: (local[i].x + local[i + 1].x) / 2, y: (local[i].y + local[i + 1].y) / 2 };
                            ctx.quadraticCurveTo(local[i].x, local[i].y, midpoint.x, midpoint.y);
                        }
                    }
                    const last = local[local.length - 1];
                    ctx.lineTo(last.x, last.y);
                    ctx.stroke();
                }
                ctx.restore();
            };

            const startDrawing = (e) => {
                if (!isDrawMode || activePointerRef.current !== null || (e.pointerType === 'mouse' && e.button !== 0)) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();

                historyRef.current.push(ctx.getImageData(0, 0, canvas.width, canvas.height));

                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.lineWidth = tool === 'highlighter' ? 24 : penWidth;
                ctx.strokeStyle = tool === 'highlighter' ? `${penColor}4D` : penColor;
                ctx.globalCompositeOperation = tool === 'highlighter' ? 'multiply' : 'source-over';

                const startX = e.clientX - rect.left;
                const startY = e.clientY - rect.top;

                savedImageRef.current = ctx.getImageData(0, 0, canvas.width, canvas.height);
                startPosRef.current = { x: startX, y: startY };

                ctx.beginPath();
                ctx.moveTo(startX, startY);
                penPointsRef.current = [{ x: startX, y: startY }];
                activePointerRef.current = e.pointerId;
                canvas.setPointerCapture(e.pointerId);
                if (tool === 'pen') renderPen(penPointsRef.current);
                setIsDrawing(true);
            };

            const draw = (e) => {
                if (activePointerRef.current !== e.pointerId || !isDrawMode) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const currentX = e.clientX - rect.left;
                const currentY = e.clientY - rect.top;

                if (isSnapMode || e.shiftKey) {
                    ctx.putImageData(savedImageRef.current, 0, 0);
                    const dx = currentX - startPosRef.current.x;
                    const dy = currentY - startPosRef.current.y;
                    const angle = Math.atan2(dy, dx);
                    const snappedAngle = Math.round(angle / (Math.PI / 4)) * (Math.PI / 4);
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const snapX = startPosRef.current.x + Math.cos(snappedAngle) * dist;
                    const snapY = startPosRef.current.y + Math.sin(snappedAngle) * dist;
                    if (tool === 'pen') { renderPen([startPosRef.current, { x: snapX, y: snapY }], true); return; }
                    ctx.beginPath(); ctx.moveTo(startPosRef.current.x, startPosRef.current.y); ctx.lineTo(snapX, snapY); ctx.stroke();
                } else {
                    if (tool === 'pen') {
                        const events = e.nativeEvent?.getCoalescedEvents?.() || [];
                        const samples = events.length ? events : [e];
                        samples.forEach(sample => penPointsRef.current.push({ x: sample.clientX - rect.left, y: sample.clientY - rect.top }));
                        renderPen(penPointsRef.current); return;
                    }
                    if (tool === 'highlighter') ctx.putImageData(savedImageRef.current, 0, 0);
                    ctx.lineTo(currentX, currentY); ctx.stroke();
                }
            };

            const stopDrawing = () => {
                const canvas = canvasRef.current;
                const pointer = activePointerRef.current;
                activePointerRef.current = null;
                if (pointer !== null && canvas.hasPointerCapture(pointer)) canvas.releasePointerCapture(pointer);
                if (isDrawing) { canvas.getContext('2d').closePath(); setIsDrawing(false); }
            };

            const selectTool = (nextTool) => {
                stopDrawing();
                const enabled = nextTool !== 'selector' && !(isDrawMode && tool === nextTool);
                setIsDrawMode(enabled);
                if (nextTool !== 'selector') setTool(nextTool);
            };

            useEffect(() => {
                const onKey = (event) => {
                    if (event.key === 'Escape') { setIsDrawing(false); setIsDrawMode(false); }
                    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'z') {
                        if (historyRef.current.length > 0) {
                            const lastState = historyRef.current.pop();
                            const canvas = canvasRef.current;
                            canvas.getContext('2d').putImageData(lastState, 0, 0);
                            savedImageRef.current = lastState;
                        }
                    }
                };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, []);

            const clearCanvas = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                historyRef.current.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                savedImageRef.current = ctx.getImageData(0, 0, canvas.width, canvas.height);
            };

            const colors = [
                { name: 'Rojo', hex: '#ef4444', tw: 'bg-[#ef4444]' },
                { name: 'Negro', hex: '#0f172a', tw: 'bg-[#0f172a]' },
                { name: 'Azul', hex: '#3b82f6', tw: 'bg-[#3b82f6]' },
                { name: 'Verde', hex: '#22c55e', tw: 'bg-[#22c55e]' },
                { name: 'Amarillo', hex: '#facc15', tw: 'bg-[#facc15]' }
            ];

            return (
                <>
                    <div style={{ zIndex: 120, pointerEvents: 'auto' }} className="absolute top-2 right-2 flex flex-wrap max-w-[calc(100%-1rem)] justify-end gap-1.5 sm:gap-2 pointer-events-auto bg-white/85 p-1.5 rounded-xl backdrop-blur-sm shadow-md border border-slate-200">
                        <button onClick={() => selectTool('selector')} aria-pressed={!isDrawMode} title="Seleccionar (Esc)" className={`px-2.5 py-1 sm:px-3 sm:py-1.5 text-xs font-black rounded-lg border-2 shadow-sm transition-all ${!isDrawMode ? 'bg-cyan-500 text-white border-cyan-600' : 'bg-white text-slate-600 border-slate-300'}`}>🖱️ Selector</button>
                        <button onClick={() => selectTool('pen')} className={`px-2.5 py-1 sm:px-3 sm:py-1.5 text-xs font-black rounded-lg border-2 shadow-sm transition-all ${isDrawMode && tool === 'pen' ? 'bg-indigo-500 text-white border-indigo-600 scale-105' : 'bg-white text-slate-600 border-slate-300'}`}>🖊️ Lápiz</button>
                        <button onClick={() => selectTool('highlighter')} className={`px-2.5 py-1 sm:px-3 sm:py-1.5 text-xs font-black rounded-lg border-2 shadow-sm transition-all ${isDrawMode && tool === 'highlighter' ? 'bg-yellow-400 text-slate-900 border-yellow-500 scale-105' : 'bg-white text-slate-600 border-slate-300'}`}>🖍️ Resaltador</button>
                        {isDrawMode && tool === 'pen' && (
                            <label className="flex items-center gap-1.5 px-2 py-1 rounded-lg bg-white border-2 border-indigo-200 text-xs font-black text-slate-700">
                                Grosor <input type="range" min="3" max="16" step="1" value={penWidth} onChange={e => setPenWidth(Number(e.target.value))} className="w-16 accent-indigo-600" />
                            </label>
                        )}
                        {isDrawMode && (
                            <>
                                <button onClick={() => setIsSnapMode(!isSnapMode)} className={`px-2.5 py-1 sm:px-3 sm:py-1.5 text-xs font-black rounded-lg border-2 shadow-sm transition-all ${isSnapMode ? 'bg-blue-500 text-white border-blue-600 scale-105' : 'bg-white text-slate-600 border-slate-300'}`}>📐 Recto</button>
                                <button onClick={clearCanvas} className="px-2.5 py-1 sm:px-3 sm:py-1.5 text-xs font-black bg-white text-rose-600 border-2 border-rose-300 rounded-lg shadow-sm hover:bg-rose-50 active:scale-95 transition-all">🗑️ Limpiar</button>
                                <div className="px-2 py-1 text-[11px] font-bold text-slate-400 hidden sm:flex items-center bg-white rounded-lg border border-slate-200">CTRL+Z: Deshacer</div>
                            </>
                        )}
                    </div>
                    {isDrawMode && (
                        <div className="absolute top-1/2 right-3 -translate-y-1/2 z-[110] flex flex-col gap-2.5 p-2 bg-white/90 backdrop-blur-md rounded-xl border-[3px] border-slate-200 shadow-xl pointer-events-auto">
                            {colors.map(c => (
                                <button key={c.hex} onClick={() => setPenColor(c.hex)} title={c.name} className={`w-7 h-7 sm:w-9 sm:h-9 rounded-full border-[3px] shadow-sm transition-all hover:scale-110 active:scale-95 ${c.tw} ${penColor === c.hex ? 'border-white outline outline-[3px] outline-slate-800 scale-110' : 'border-black/20'}`} />
                            ))}
                        </div>
                    )}
                    <canvas
                        ref={canvasRef}
                        style={{ zIndex: 100, pointerEvents: isDrawMode ? 'auto' : 'none', touchAction: isDrawMode ? 'none' : 'auto' }}
                        className={`absolute inset-0 z-[100] touch-none ${isDrawMode ? 'cursor-crosshair pointer-events-auto' : 'pointer-events-none'}`}
                        onPointerDown={startDrawing}
                        onPointerMove={draw}
                        onPointerUp={e => { if (activePointerRef.current === e.pointerId) { draw(e); stopDrawing(); } }}
                        onPointerLeave={e => { if (!e.currentTarget.hasPointerCapture(e.pointerId)) stopDrawing(); }}
                        onLostPointerCapture={stopDrawing}
                        onPointerCancel={stopDrawing}
                    />
                </>
            );
        };

        // =========================================================================
        // 4. VISUALIZADOR 1: SALTO MANUAL DE LA COMA ROJA (DERECHA E IZQUIERDA)
        // =========================================================================
        const CommaJumpVisualizer = memo(({ config }) => {
            const {
                direction,       // 'right' | 'left'
                digits,          // array de celdas: { char, added?: boolean, fade?: boolean, ellipsis?: boolean }
                startSlot,       // índice inicial de la coma (borde entre celdas)
                jumps,           // cantidad de saltos (1, 2 o 3)
                factorLabel,     // "10", "100", "1 000", "0,1", "0,01", "0,010"
                ruleText,        // texto explicativo superior
                finalDisplay,    // resultado limpio final
                noteText,        // nota breve sobre ceros agregados o eliminados
                hideCommaAtEnd   // true si el resultado es entero
            } = config;

            const [currentJump, setCurrentJump] = useState(0);

            useEffect(() => {
                setCurrentJump(0);
            }, [config]);

            const moveComma = () => {
                if (currentJump < jumps) {
                    setCurrentJump(j => j + 1);
                }
            };

            const resetComma = () => {
                setCurrentJump(0);
            };

            const n = digits.length;
            const cellW = Math.min(54, Math.floor(460 / Math.max(n, 5)));
            const totalW = n * cellW;
            const startX = (540 - totalW) / 2;
            const boxY = 148;
            const boxH = 62;

            const commaSlot = direction === 'right' ? startSlot + currentJump : startSlot - currentJump;
            const commaX = startX + commaSlot * cellW;
            const finished = currentJump >= jumps;

            const renderFactorBadge = () => {
                if (direction === 'right') {
                    const zeros = factorLabel.slice(1);
                    return (
                        <g>
                            <rect x="85" y="14" width="370" height="44" rx="14" fill="#fef3c7" stroke="#f59e0b" strokeWidth="2.5" />
                            <text x="270" y="34" textAnchor="middle" fontSize="14.5" fontWeight="900" fill="#78350f">
                                Factor: <tspan fill="#0f172a">1</tspan><tspan fill="#dc2626" fontSize="16">{zeros}</tspan>  →  {jumps} {jumps === 1 ? 'lugar' : 'lugares'} a la DERECHA ➔
                            </text>
                            <text x="270" y="51" textAnchor="middle" fontSize="11.5" fontWeight="800" fill="#92400e">
                                {ruleText}
                            </text>
                        </g>
                    );
                }
                return (
                    <g>
                        <rect x="65" y="14" width="410" height="44" rx="14" fill="#e0f2fe" stroke="#0284c7" strokeWidth="2.5" />
                        <text x="270" y="34" textAnchor="middle" fontSize="14.5" fontWeight="900" fill="#0c4a6e">
                            Factor: <tspan fill="#dc2626" fontSize="16">{factorLabel}</tspan>  →  ⬅ {jumps} {jumps === 1 ? 'lugar' : 'lugares'} a la IZQUIERDA
                        </text>
                        <text x="270" y="51" textAnchor="middle" fontSize="11.5" fontWeight="800" fill="#0369a1">
                            {ruleText}
                        </text>
                    </g>
                );
            };

            return (
                <div className="w-full h-full flex flex-col items-center justify-center relative">
                    <svg viewBox="0 0 540 355" className="w-full max-h-[360px]" role="img" aria-label="Animación manual del salto de la coma decimal">
                        {renderFactorBadge()}

                        {/* Arcos de salto acumulados */}
                        {Array.from({ length: currentJump }).map((_, idx) => {
                            const s0 = direction === 'right' ? startSlot + idx : startSlot - idx;
                            const s1 = direction === 'right' ? s0 + 1 : s0 - 1;
                            const x0 = startX + s0 * cellW;
                            const x1 = startX + s1 * cellW;

            };
            const getMouth = () => {
                if (isFinalStep) return <div className="w-4 h-2.5 bg-rose-400 rounded-b-full mt-1"></div>;
                if (step === 0) return <div className="w-3 h-1 bg-cyan-300 rounded-full mt-1"></div>;
                return <div className="w-2.5 h-2.5 bg-rose-400 rounded-full mt-1 animate-ping"></div>;
            };

            return (
                <div className={`relative flex flex-col items-center drop-shadow-xl select-none ${getContainerAnim()}`}>
                    <div className="relative z-0 flex flex-col items-center translate-y-1">
                        <div className={`w-2.5 h-2.5 rounded-full shadow-[0_0_10px_currentColor] z-10 transition-colors duration-300 ${isFinalStep ? 'text-emerald-400 bg-emerald-400' : 'text-yellow-400 bg-yellow-400 animate-pulse'}`}></div>
                        <div className="w-1.5 h-3 bg-slate-300"></div>
                    </div>
                    <div className="relative z-10 w-12 h-12 sm:w-14 sm:h-14 bg-gradient-to-br from-white to-slate-200 rounded-xl border-[2.5px] border-indigo-400 shadow-xl flex flex-col items-center justify-center p-1">
                        <div className="w-full h-full bg-slate-900 rounded-lg flex flex-col items-center justify-center p-1 shadow-inner border-[1.5px] border-indigo-500">
                            {getEyes()}
                            {getMouth()}
                        </div>
                    </div>
                    <div className={`absolute top-1/2 -left-1.5 w-2 h-4 bg-slate-200 border-[2px] border-indigo-400 rounded-full z-0 origin-top ${getArmLAnim()}`}></div>
                    <div className={`absolute top-1/2 -right-1.5 w-2 h-4 bg-slate-200 border-[2px] border-indigo-400 rounded-full z-0 origin-top ${getArmRAnim()}`}></div>
                </div>
            );
        };

        // =========================================================================
        // 12. APLICACIÓN PRINCIPAL
        // =========================================================================
        function App() {
            const [view, setView] = useState('home');
            const [exIdx, setExIdx] = useState(0);
            const [step, setStep] = useState(0);
            const scrollContainerRef = useRef(null);

            const curEx = EXERCISES[exIdx];
            const maxSteps = curEx.steps.length - 1;
            const curStepData = curEx.steps[step];
            const EnunciadoText = curEx.enunciado;

            const startExercise = (index) => {
                setExIdx(index);
                setStep(0);
                setView('lab');
            };

            const nextStep = () => {
                if (step < maxSteps) {
                    setStep(step + 1);
                } else {
                    if (exIdx < EXERCISES.length - 1) {
                        setExIdx(exIdx + 1);
                        setStep(0);
                    } else {
                        setView('home');
                    }
                }
            };

            const prevStep = () => {
                if (step > 0) {
                    setStep(step - 1);
                }
            };

            useEffect(() => {
                if (scrollContainerRef.current) {
                    scrollContainerRef.current.scrollTop = scrollContainerRef.current.scrollHeight;
                }
            }, [step, exIdx, view]);

            // ------------------------- PORTADA (2 BLOQUES, 11 RETOS) -------------------------
            if (view === 'home') {
                const block1 = EXERCISES.filter(e => e.block === 1);
                const block2 = EXERCISES.filter(e => e.block === 2);

                const renderCard = (ex) => {
                    const idx = EXERCISES.findIndex(item => item.id === ex.id);
                    return (
                        <button
                            key={ex.id}
                            onClick={() => startExercise(idx)}
                            className="group text-left p-4 rounded-[1.5rem] bg-white/10 backdrop-blur-xl border-[3px] border-white/35 hover:border-yellow-300 hover:-translate-y-1.5 hover:shadow-[0_16px_30px_rgba(0,0,0,0.38)] transition-all flex flex-col relative overflow-hidden shadow-lg min-h-[10.5rem]"
                        >
                            <div className={`absolute inset-0 bg-gradient-to-br ${ex.cardGradient} opacity-85 group-hover:opacity-100 transition-opacity`}></div>
                            <div className="relative z-10 flex-1 flex flex-col">
                                <div className="flex items-center justify-between mb-2">
                                    <span className={`${ex.badgeColor} text-white text-xs font-black px-3 py-0.5 rounded-full uppercase tracking-wider shadow-sm`}>
                                        {ex.title}
                                    </span>
                                    <span className="text-white/95 text-xs font-extrabold bg-black/25 px-2.5 py-0.5 rounded-full">
                                        {ex.steps.length} pasos
                                    </span>
                                </div>
                                <div className="flex-1 my-1.5 bg-white/95 rounded-xl px-2.5 py-2 text-slate-900 shadow-inner flex items-center justify-center border border-white/60 pointer-events-none math-card">
                                    <MathDisplay latex={ex.previewLatex} align="center" />
                                </div>
                                <div className="text-white text-sm sm:text-base font-black text-center mt-1.5 drop-shadow-md">
                                    {ex.subtitle}
                                </div>
                            </div>
                        </button>
                    );
                };

                return (
                    <div className="w-screen h-[100dvh] bg-gradient-to-br from-[#1e3a8a] via-[#4338ca] to-[#be185d] flex flex-col items-center justify-start p-4 sm:p-6 relative font-fun overflow-y-auto scrollbar-hide">
                        <FloatingBackground />

                        {/* Barra superior */}
                        <div className="w-[96%] max-w-[1400px] z-20 flex items-center justify-between mb-5 mt-1">
                            <div className="inline-flex items-center gap-2 px-4 py-2 rounded-2xl border-2 border-yellow-300 bg-white/15 backdrop-blur-md text-yellow-300 font-black tracking-wider uppercase shadow-md text-xs sm:text-base">
                                <Rocket className="w-5 h-5 text-yellow-300" /> TuProfe20 Lab
                            </div>
                        </div>

                        {/* Encabezado de portada */}
                        <div className="relative z-10 text-center w-[96%] max-w-[1400px] flex flex-col items-center pb-12">
                            <div className="inline-flex items-center gap-2 px-4 py-1 rounded-full bg-white/15 border border-white/30 text-cyan-200 font-black text-xs sm:text-sm uppercase tracking-widest mb-3 shadow-sm">
                                Aritmética • Multiplicación de Números Decimales
                            </div>
                            <h1 className="text-3xl sm:text-5xl md:text-6xl font-black text-white mb-3 drop-shadow-[0_5px_0_rgba(0,0,0,0.3)] tracking-tight leading-tight uppercase">
                                MULTIPLICACIÓN DE <span className="text-yellow-300 underline decoration-wavy decoration-cyan-400 underline-offset-8">DECIMALES Y APLICACIONES</span>
                            </h1>
                            <p className="text-sm sm:text-lg lg:text-xl text-purple-100 mb-8 font-bold max-w-3xl leading-relaxed">
                                Domina el salto de la coma decimal, la multiplicación vertical y problemas de compras paso a paso ✨🤖
                            </p>

                            {/* BLOQUE 1 */}
                            <div className="w-full mb-8">
                                <div className="flex items-center gap-3 mb-4">
                                    <span className="px-4 py-1.5 rounded-full bg-cyan-400 text-slate-950 font-black text-xs sm:text-sm uppercase tracking-widest shadow-md">
                                        Bloque 1 • Técnicas y Propiedades (Retos 1 al 5)
                                    </span>
                                    <div className="flex-1 h-[2px] bg-white/25 rounded-full"></div>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                                    {block1.map(renderCard)}
                                </div>
                            </div>

                            {/* BLOQUE 2 */}
                            <div className="w-full">
                                <div className="flex items-center gap-3 mb-4">
                                    <span className="px-4 py-1.5 rounded-full bg-yellow-400 text-slate-950 font-black text-xs sm:text-sm uppercase tracking-widest shadow-md">
                                        Bloque 2 • Problemas de Aplicación (Retos 6 al 11)
                                    </span>
                                    <div className="flex-1 h-[2px] bg-white/25 rounded-full"></div>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {block2.map(renderCard)}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // ------------------------- VISTA LABORATORIO -------------------------
            return (
                <div className="w-screen h-[100dvh] bg-gradient-to-br from-[#0f172a] via-[#312e81] to-[#831843] text-slate-800 flex flex-col p-2 sm:p-3.5 relative font-fun overflow-hidden">
                    <FloatingBackground />
                    {step === maxSteps && <Confetti />}

                    {/* Barra superior */}
                    <div className="shrink-0 relative z-10 w-[98%] max-w-[1440px] mx-auto flex justify-between items-center mb-2.5 px-1 gap-2">
                        <div className="flex items-center gap-2">
                            <button
                                onClick={() => setView('home')}
                                className="flex items-center justify-center px-3.5 py-2 rounded-[1rem] bg-white/10 border-[2.5px] border-white/30 backdrop-blur-md text-white font-black hover:bg-white/20 transition-all shadow-lg active:scale-95 text-xs sm:text-sm"
                            >
                                <Home className="w-4 h-4 sm:w-5 sm:h-5 sm:mr-1.5" />
                                <span className="hidden sm:inline">Portada</span>
                            </button>
                            <div className="hidden xl:flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white/10 border border-yellow-300/40 text-yellow-300 font-black text-xs uppercase tracking-wider">
                                <Rocket className="w-4 h-4" /> TuProfe20 Lab
                            </div>
                        </div>

                        {/* Selector numérico 1 al 11 */}
                        <div className="flex items-center gap-1 sm:gap-1.5 bg-black/35 p-1.5 rounded-[1rem] border-2 border-white/20 backdrop-blur-md shadow-lg overflow-x-auto scrollbar-hide max-w-[75vw]">
                            {EXERCISES.map((ex, i) => (
                                <button
                                    key={ex.id}
                                    onClick={() => startExercise(i)}
                                    className={`shrink-0 w-7 h-7 sm:w-9 sm:h-9 rounded-[0.7rem] font-black text-xs sm:text-sm transition-all ${
                                        exIdx === i
                                            ? 'bg-yellow-400 text-slate-900 scale-110 shadow-[0_0_12px_rgba(250,204,21,0.75)]'
                                            : 'text-white hover:bg-white/20'
                                    }`}
                                >
                                    {ex.id}
                                </button>
                            ))}
                        </div>

                        <div className="w-10 hidden sm:block"></div>
                    </div>

                    {/* Pizarra principal */}
                    <div className="flex-1 min-h-0 relative z-10 w-[98%] max-w-[1440px] mx-auto bg-white rounded-[1.8rem] sm:rounded-[2.2rem] border-[5px] sm:border-[7px] border-slate-100 shadow-[0_25px_55px_rgba(0,0,0,0.5)] flex flex-col overflow-hidden">

                        {/* Encabezado oscuro con enunciado */}
                        <div className="shrink-0 bg-slate-900 border-b-[4px] border-cyan-500 px-4 py-2.5 sm:px-6 sm:py-3 flex flex-col justify-center relative shadow-md z-20">
                            <div className="flex justify-between items-center w-full max-w-6xl mx-auto mb-1">
                                <span className="bg-cyan-400 text-slate-950 font-black text-xs sm:text-sm px-3 py-0.5 rounded-md uppercase tracking-widest shadow-sm">
                                    {curEx.title}
                                </span>
                                <span className="text-yellow-300 font-extrabold text-xs sm:text-sm bg-white/10 px-3 py-0.5 rounded-md">
                                    {curEx.subtitle}
                                </span>
                            </div>
                            <div className="text-white font-bold text-sm sm:text-lg md:text-xl text-center w-full max-w-5xl mx-auto leading-snug math-enunciado">
                                <EnunciadoText />
                            </div>
                        </div>

                        {/* Área dividida 50% / 50% */}
                        <div className="flex-1 flex flex-col md:flex-row bg-slate-50 overflow-hidden relative">

                            {/* PANEL IZQUIERDO: DESARROLLO AMPLIADO PARA CLASE VIRTUAL */}
                            <div
                                ref={scrollContainerRef}
                                className="w-full md:w-1/2 flex-1 px-5 py-4 sm:px-7 sm:py-5 overflow-y-auto scrollbar-hide flex flex-col gap-4 pb-20 relative z-10 border-b-2 md:border-b-0 md:border-r-2 border-slate-200/70"
                            >
                                <div className="absolute inset-0 opacity-[0.04] bg-[radial-gradient(#0f172a_1.5px,transparent_1.5px)] [background-size:20px_20px] pointer-events-none"></div>

                                <div className="relative z-10 flex items-center justify-between border-b border-slate-200 pb-2">
                                    <span className="text-xs sm:text-sm font-black uppercase tracking-widest text-indigo-600">
                                        Desarrollo Paso a Paso
                                    </span>
                                    <span className="text-xs sm:text-sm font-extrabold text-slate-400">
                                        {curEx.block === 1 ? 'Técnicas Decimales' : 'Problema de Aplicación'}
                                    </span>
                                </div>

                                {curEx.steps.slice(0, step + 1).map((s, idx) => {
                                    const isCurrent = idx === step;
                                    const isFinal = isCurrent && step === maxSteps;
                                    return (
                                        <div
                                            key={`${exIdx}-${idx}`}
                                            className={`relative z-10 pl-4 py-2 transition-all duration-300 border-l-[5px] border-b border-slate-200/60 last:border-b-0 ${
                                                isFinal
                                                    ? 'border-l-amber-400 animate-finalGlow rounded-r-xl pr-3 opacity-100 animate-slideInRight'
                                                    : isCurrent
                                                        ? 'border-l-cyan-500 opacity-100 animate-slideInRight'
                                                        : 'border-l-slate-300 opacity-60'
                                            }`}
                                        >
                                            <div className="mb-1.5 flex items-center gap-2">
                                                <span
                                                    className={`inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full font-black text-xs sm:text-sm tracking-wide ${
                                                        isFinal
                                                            ? 'bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 shadow-sm'
                                                            : isCurrent
                                                                ? 'bg-gradient-to-r from-cyan-500 to-blue-600 text-white shadow-sm'
                                                                : 'bg-slate-200 text-slate-600'
                                                    }`}
                                                >
                                                    {isCurrent && <Sparkles className="w-3.5 h-3.5" />}
                                                    {s.badge}
                                                </span>
                                            </div>
                                            <div className={`py-1 ${isFinal ? 'math-final' : isCurrent ? 'math-current' : 'math-history'}`}>
                                                <MathDisplay latex={s.latex} align="left" />
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                            {/* PANEL DERECHO: ESQUEMA GRÁFICO REACTIVO */}
                            <div className="w-full md:w-1/2 flex-1 bg-white/85 p-3 sm:p-5 flex flex-col items-center justify-center relative z-10 pointer-events-none">
                                <h3 className="absolute top-3 left-4 font-black text-slate-400 uppercase tracking-widest text-[11px] sm:text-xs flex items-center gap-1.5 z-20">
                                    <Shapes className="w-4 h-4 text-cyan-500" /> Esquema Interactivo
                                </h3>
                                <div className="w-full h-full flex items-center justify-center pt-5 pointer-events-auto">
                                    <RightPanelGraphic exercise={curEx} step={step} />
                                </div>
                            </div>

                            {/* Pizarra superpuesta */}
                            <DrawingCanvas />
                        </div>

                        {/* Barra del Robot Asistente */}
                        <div className="shrink-0 bg-white w-full px-4 py-2 sm:px-6 sm:py-2.5 flex items-center gap-3 sm:gap-5 border-t-[3px] border-slate-100 z-30 relative shadow-[0_-8px_18px_rgba(0,0,0,0.04)]">
                            <div className="shrink-0 absolute -top-9 sm:relative sm:top-0 left-3 sm:left-0 drop-shadow-xl z-50">
                                <RobotAssistant step={step} maxSteps={maxSteps} />
                            </div>
                            <div className="flex-1 text-xs sm:text-sm md:text-base font-bold text-slate-700 leading-snug bg-blue-50/90 px-3 py-2 sm:px-4 sm:py-2.5 rounded-[1rem] border-2 border-blue-100 min-h-[2.8rem] flex items-center shadow-sm ml-[3.4rem] sm:ml-0">
                                <div key={`speech-${exIdx}-${step}`} className="animate-slideInRight w-full">
                                    {curStepData.robotSpeech}
                                </div>
                            </div>
                        </div>

                        {/* Controles inferiores */}
                        <div className="shrink-0 bg-gradient-to-b from-[#e0e7ff] to-[#c7d2fe] p-2 sm:p-2.5 w-full flex flex-col items-center border-t-[3px] border-white z-40">
                            <div className="flex justify-center items-stretch w-full max-w-4xl gap-2 sm:gap-3 h-9 sm:h-10">
                                <button
                                    onClick={prevStep}
                                    disabled={step === 0}
                                    className="flex-[0.8] bg-[#a5b4fc] border-b-[4px] border-[#6366f1] text-[#312e81] rounded-l-xl font-black text-xs sm:text-sm flex items-center justify-center gap-1 active:border-b-0 active:translate-y-[4px] disabled:opacity-40 transition-all hover:bg-[#c7d2fe]"
                                >
                                    <ChevronLeft className="w-4 h-4 sm:w-5 sm:h-5 stroke-[3px]" />
                                    <span className="hidden sm:inline">Atrás</span>
                                </button>
                                <div className="bg-[#6366f1] text-white font-black px-3 sm:px-5 text-xs sm:text-sm flex items-center justify-center border-b-[4px] border-[#4338ca] shadow-inner whitespace-nowrap min-w-[4.5rem]">
                                    Paso {step + 1}/{maxSteps + 1}
                                </div>
                                <button
                                    onClick={nextStep}
                                    className={`flex-[2] border-b-[4px] text-white rounded-r-xl font-black text-xs sm:text-sm flex items-center justify-center gap-1 active:border-b-0 active:translate-y-[4px] transition-all shadow-sm hover:brightness-110 ${
                                        step === maxSteps
                                            ? 'bg-gradient-to-r from-[#10b981] to-[#047857] border-[#065f46] animate-pulse'
                                            : 'bg-gradient-to-r from-[#06b6d4] to-[#0284c7] border-[#0369a1]'
                                    }`}
                                >
                                    <span>
                                        {step < maxSteps
                                            ? '¡Siguiente Paso!'
                                            : exIdx < EXERCISES.length - 1
                                                ? `Siguiente Reto (${curEx.id + 1})`
                                                : '¡Volver a Portada!'}
                                    </span>
                                    <ChevronRight className="w-4 h-4 sm:w-5 sm:h-5 stroke-[3px]" />
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
